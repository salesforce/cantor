cantor {
  grpc.port = 7443
  storage.type = h2
  storage.type = ${?CANTOR_STORAGE_TYPE}

  h2 = [
    {
      path=./cantor-h2.db
      in-memory=false
      compressed=false
      username=root
      password=""
    }
  ]

  mysql = [
    {
      hostname=host.docker.internal
      port=3306
      username=root
      password=""
    }
  ]

  s3 = {
    bucket=bucket-place-holder
    bucket=${?CANTOR_S3_BUCKET}
    region=us-west-2
    region=${?CANTOR_S3_REGION}
    sets.type=h2
    select.type=s3
    select.type=${?CANTOR_S3_SELECT_TYPE}
  }

  multicloudj = {
    # supported providers: aws, gcp, ali
    provider=aws
    provider=${?CANTOR_MULTICLOUDJ_PROVIDER}
    bucket=bucket-place-holder
    bucket=${?CANTOR_MULTICLOUDJ_BUCKET}
    region=us-west-2
    region=${?CANTOR_MULTICLOUDJ_REGION}
    sets.type=h2
    sets.type=${?CANTOR_MULTICLOUDJ_SETS_TYPE}
    # optional static credentials; aws/gcp fall back to their own SDK-default credential
    # chains when these are left empty, but ali requires them to be set
    access-key-id=""
    access-key-id=${?CANTOR_MULTICLOUDJ_ACCESS_KEY_ID}
    secret-access-key=""
    secret-access-key=${?CANTOR_MULTICLOUDJ_SECRET_ACCESS_KEY}
    session-token=""
    session-token=${?CANTOR_MULTICLOUDJ_SESSION_TOKEN}
  }
}
